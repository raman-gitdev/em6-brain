server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://orchestrator:8000;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream the brain's words as they come
        proxy_read_timeout 900s;      # a slow answer is not an error
        client_max_body_size 50m;     # room for file uploads later
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
